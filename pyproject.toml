[project]
name = "shici"
version = "0.1.0"
description = "Generate classical Chinese poetry under strict tonal & rhyme rules, powered by LLMs."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "shici contributors" },
]
keywords = [
    "poetry",
    "chinese",
    "tang",
    "song",
    "ci",
    "llm",
    "cli",
    "tui",
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pypinyin>=0.51",
    "jieba>=0.42",
]

[project.optional-dependencies]
llm = [
    "instructor>=1.3",
    "litellm>=1.50",
    "openai>=1.50",
]
tui = [
    "textual>=0.80",
]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "vcrpy>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings-python>=1.0",
    "pymdown-extensions>=10.0",
]
all = [
    "shici[llm,tui,rag,dev]",
]

[project.scripts]
shici = "shici.cli:app"
shici-tui = "shici.app:run"

[project.urls]
Homepage = "https://github.com/EZfan/shici"
Documentation = "https://anthropics.github.io/shici"
Repository = "https://github.com/EZfan/shici"
Issues = "https://github.com/EZfan/shici/issues"
Changelog = "https://github.com/EZfan/shici/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shici"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration (deselect with -m 'not integration')",
    "eval: marks tests as evaluation (LLM-as-judge, requires API key)",
]